# CI = Continuous Integration. On every push and pull request, GitHub borrows a
# fresh computer, installs everything, and checks the code still lints, passes
# its tests and builds. Nothing here runs on your laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # A throwaway Postgres just for this CI run. It's deleted when the job ends,
    # so tests never touch your real Neon data.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stokvel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stokvel_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/stokvel_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Once we have tables (US-01), add: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
